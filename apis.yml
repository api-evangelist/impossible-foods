name: Impossible Foods
description: 'Impossible Foods is a Redwood City, California food-technology company that develops
  plant-based substitutes for meat, including Impossible Beef, Sausage, Chicken, Meatballs, and Pork.
  Founded in 2011 by Patrick O. Brown, the company engineers its products around heme (soy leghemoglobin)
  to replicate the taste and texture of animal meat while reducing the environmental footprint of food
  production. Its products are distributed through grocery retail and tens of thousands of restaurants
  across the United States and international markets including Canada, Australia, New Zealand, Hong Kong,
  Singapore, the United Arab Emirates and the United Kingdom. Impossible Foods is a private, venture-backed
  company surfaced in the API Evangelist network as a GV (Google Ventures) portfolio company; it does not
  currently publish a public developer API.'
